# Local container rehearsal of the public demo. Copy .env.example to .env and
# fill the Nebius values first; without them the container refuses to start in
# nebius-demo mode, which is the intended behavior.
services:
  agrofield:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - agrofield-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
volumes:
  agrofield-data:
